<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Character death preview</title>
<style>
body {margin:0;background:#202831;color:#eee;font:15px system-ui} canvas {display:block}
nav {position:absolute;top:16px;left:16px;display:flex;gap:12px;align-items:center}
button,select {font:inherit;padding:6px} #time {font-variant-numeric:tabular-nums}
</style>
<nav><button id="replay">Replay fall</button><label>Stance <select id="stance"><option value="0">Standing</option><option value="0.5">Half crouched</option><option value="1">Crouched</option></select></label><label>Shot <select id="direction"><option value="0">Front</option><option value="1.57079632679">Side</option><option value="3.14159265359">Behind</option></select></label><span id="time">Loading…</span></nav>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {DuelAnimator} from '../src/range/duel/animation.ts';
import {closestSegments} from '../src/range/duel/death-collisions.ts';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#202831');
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.5));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,5,2);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x54616b}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);
scene.add(new THREE.GridHelper(20,40,0x82919b,0x64717b));
const camera = new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.01,50);
camera.position.set(3.2,2,3.2);camera.lookAt(0,.7,.25);
const loader=new GLTFLoader();
const target=await loader.loadAsync('/models/target.glb');
const motion=await loader.loadAsync('/models/duel-motion.glb');
let model, animator, actor, age=0, running=false, limbs=[];
const render=()=>{renderer.render(scene,camera);document.querySelector('#time').textContent=`${age.toFixed(2)} s`;};
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,.25);controls.update();controls.addEventListener('change',render);
function reset(options={}) {
  if(options.duck!==undefined)document.querySelector('#stance').value=String(options.duck);
  if(options.direction!==undefined){
    const select=document.querySelector('#direction'),option=[...select.options].find(o=>Math.abs(Number(o.value)-options.direction)<1e-6);
    if(option)select.value=option.value;
  }
  if(model){animator.dispose();scene.remove(model);model.traverse(n=>n.skeleton?.dispose());}
  model=clone(target.scene);model.position.y=options.height??0;model.rotation.y=options.yaw??0;scene.add(model);
  model.traverse(node=>{if(node.name.startsWith('held_weapon_target'))node.visible=false;});
  actor={id:1,alive:true,position:{x:0,y:1.6256,z:0},feet:0,velocity:options.velocity??{x:0,z:0},yaw:Math.PI+(options.yaw??0),pitch:options.pitch??0,
    duckAmount:options.duck??Number(document.querySelector('#stance').value),grounded:true,equipment:'ak47',reloading:false};
  animator=new DuelAnimator(model,motion.animations,options.phase??0,'ak47');
  animator.update(actor,0);animator.setDeathWorld({floor:0,boxes:options.boxes??[]});
  const angle=options.direction??Number(document.querySelector('#direction').value);
  Object.assign(actor,{alive:false,deathDirection:{x:Math.sin(angle),y:0,z:-Math.cos(angle)},deathGroup:options.group??'chest',deathImpulse:options.impulse??2.5});
  animator.update(actor,0);
  limbs=['L','R'].flatMap(side=>['leg','arm'].map(kind=>{
    const upper=model.getObjectByName(`${kind}_upper_${side}`),lower=model.getObjectByName(`${kind}_lower_${side}`),tip=model.getObjectByName(`${kind==='leg'?'ankle':'hand'}_${side}`);
    const u=lower.getWorldPosition(new THREE.Vector3()).sub(upper.getWorldPosition(new THREE.Vector3())).normalize();
    const v=tip.getWorldPosition(new THREE.Vector3()).sub(lower.getWorldPosition(new THREE.Vector3())).normalize();
    const axis=new THREE.Vector3().crossVectors(u,v).normalize().applyQuaternion(upper.getWorldQuaternion(new THREE.Quaternion()).invert());
    return {upper,lower,tip,axis,initial:lower.quaternion.clone()};
  }));
  age=0;running=false;render();
}
function step(dt){animator.update(actor,dt);age+=dt;render();}
function advance(seconds,draw=true){for(let i=0;i<Math.round(seconds*120);i++){animator.update(actor,1/120);age+=1/120;}if(draw)render();}
function sample(){
  const rag=animator.dynamicDeath;
  const joints=rag?.bodies.map(b=>({name:b.name,solver:rag.point(b.name),rendered:model.getObjectByName(b.name)?.getWorldPosition(new THREE.Vector3()).toArray()}));
  let penetration=0,worstPair=null;
  const contacts=rag?.capsuleContacts,result=new Float64Array(6);
  if(contacts)for(const pair of contacts.pairs){
    const a=contacts.definitions[pair.a],b=contacts.definitions[pair.b];
    const ends=cap=>{
      const p=joints.find(j=>j.name===cap.a).rendered,q=joints.find(j=>j.name===cap.b).rendered;
      return [cap.start??0,cap.end??1].map(t=>p.map((v,k)=>v*(1-t)+q[k]*t));
    };
    closestSegments(...ends(a),...ends(b),result);
    const overlap=a.radius+b.radius-result[5];
    if(overlap>penetration){penetration=overlap;worstPair=[a.name,b.name];}
  }
  const angles=limbs.map(({upper,lower,tip,axis,initial})=>{
    const u=lower.getWorldPosition(new THREE.Vector3()).sub(upper.getWorldPosition(new THREE.Vector3())).normalize();
    const v=tip.getWorldPosition(new THREE.Vector3()).sub(lower.getWorldPosition(new THREE.Vector3())).normalize();
    const normal=axis.clone().applyQuaternion(upper.getWorldQuaternion(new THREE.Quaternion()));
    const delta=lower.quaternion.clone().multiply(initial.clone().invert());
    return {name:lower.name,bend:Math.atan2(normal.dot(new THREE.Vector3().crossVectors(u,v)),u.dot(v))*180/Math.PI,
      offAxis:2*Math.asin(Math.min(1,new THREE.Vector3(delta.x,delta.y,delta.z).cross(axis).length()))*180/Math.PI};
  });
  return {age,sleeping:rag?.sleeping,stats:rag?.stats,penetration,worstPair,joints,angles};
}
window.deathPreview={reset,step,advance,sample,view(position,target){camera.position.fromArray(position);controls.target.fromArray(target);controls.update();render();}};reset();
let last=performance.now();
function tick(now){const dt=Math.min((now-last)/1000,1/30);last=now;if(running){step(dt);if(age>4)running=false;}requestAnimationFrame(tick);}
requestAnimationFrame(tick);
document.querySelector('#replay').onclick=()=>{reset();running=true;};
for(const id of ['stance','direction'])document.querySelector(`#${id}`).onchange=()=>{reset();running=true;};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();});
</script>
</html>
